# Dobot Magician 关节限位与开机回零位姿（单位：度）
# 所有运动指令在发送前都会按这里的范围检查；超限直接拒绝，不会下发。
joint_limits_deg:
  j1: [-90, 90]   # 底座
  j2: [0, 85]     # 大臂
  j3: [-10, 90]   # 小臂
  j4: [-90, 90]   # 末端旋转

# 开机回零：两台机械臂都移动到这组关节角，保证同一初始位姿。
# 标准位姿 j1=0, j2=45, j3=45, j4=0（底座/大臂/小臂/末端，度）。
# 必须位于上面的限位范围内；改这里即可换起始位姿。
home_deg: [0, 45, 45, 0]

# 采集 ready 位姿（2026-10-28 实测可用，两臂相同）。
# 笛卡尔：x=120, y=0, z=20, r=0；x 已是工作空间下限，z=20 高于回零 z≈-8.5。
# 关节：[0, 10.88, 49.98, 0]；j2 距下限 10.9°，j3 距上限 40°。
# 注意：从 ready 抬 z 会让 j2 下降，先向 +x/+y 再抬升。
ready_deg: [0, 10.88, 49.98, 0]
ready_speed_pct: 20
ready_tolerance_deg: 1.0

home_speed_pct: 20        # 仅手动回零备用；厂家 SetHOMECmd 使用固件内置速度
home_tolerance_deg: 1.0   # 到位判定误差
home_timeout_s: 120       # 厂家回零会展开扫掠，最长可能 120s

# 每次回零后，j4 逆时针旋转该角度并保持（锁关节角）。
# 88° 留 2° 安全余量（j4 限位 ±90°）；吸盘轴对称，不影响末端位置。
# 由 src/dobot_rua/hardware/dobot.py 的 DobotRobot.home() 强制执行。
post_home_j4_offset_deg: 88.0
