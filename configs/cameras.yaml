# 三路 USB 摄像头角色定义（2026-11-07 实测确认）
# 型号：GP_Flip_Mirror: 8M USB camera（三台同型号，靠 USB 端口区分，
#       不能用型号名区分，必须按 device 节点或 usb_port 绑定）。
# 每台摄像头在 /dev 下有两个节点：videoN（采集）和 videoN+1（metadata），
# 采集一律使用偶数节点。
# 注意：重启或换 USB 口后节点号可能变化，使用前用
#       `v4l2-ctl --list-devices` 复核。

cameras:
  wrist:
    device: /dev/video0
    usb_port: "usb-0000:00:14.0-1"
    role: 腕部相机，随机械臂末端移动
    view: 近景，正对末端吸盘与目标物块
    note: 2026-11-07 抓帧时镜头被半透明吸盘件挡满且失焦，实际视野需复核

  front:
    device: /dev/video2
    usb_port: "usb-0000:00:14.0-2"
    role: 前视固定相机
    view: 桌面俯视，可见白板/工作区、红蓝木块、机械臂夹爪

  side:
    device: /dev/video4
    usb_port: "usb-0000:00:14.0-4"
    role: 侧视固定相机
    view: 工作台侧视/平视，可见桌面、木块、吸盘及实验室背景

# 采集参数（三路一致）
capture:
  format: mjpeg
  default_size: [1280, 720]
  max_size: [3264, 2448]   # 最高分辨率
  fps: 30
