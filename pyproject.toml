[project]
name = "dobot-rua"
version = "0.1.0"
description = "Dobot Magician robot-use agent: colored block to line-intersection task"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "scipy>=1.11",
  "PyYAML>=6",
  "pydantic>=2,<3",
  "pandas>=2.1",
  "pyarrow>=14",
  "pydobot>=1.3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
